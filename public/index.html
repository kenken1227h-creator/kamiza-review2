<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAR BER SHOP 髪座 - ご来店アンケート</title>
<style>
  :root { --bg-color: #121212; --text-color: #f5f5f5; --accent-color: #d4af37; --box-bg: #242424; }
  body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; justify-content: center; }
  .container { max-width: 500px; width: 100%; background-color: var(--box-bg); padding: 30px; border-radius: 8px; box-sizing: border-box; }
  .lang-switch { text-align: right; margin-bottom: 20px; }
  .lang-switch select { background: #333; color: #fff; border: 1px solid #555; padding: 8px 12px; border-radius: 4px; font-size: 14px; cursor: pointer; outline: none; }
  h1 { text-align: center; color: var(--accent-color); letter-spacing: 2px; margin-top: 0; }
  p.subtitle { text-align: center; font-size: 12px; color: #aaa; margin-bottom: 24px; }

  /* 進み具合バー */
  .progress-label { font-size: 12px; color: #aaa; margin-bottom: 6px; }
  .progress { display: flex; gap: 6px; margin-bottom: 24px; }
  .progress span { flex: 1; height: 4px; background: #444; border-radius: 2px; transition: 0.3s; }
  .progress span.done { background: var(--accent-color); }

  .step { display: none; }
  .step.active { display: block; }

  .form-group { margin-bottom: 25px; }
  label.section-title { display: block; font-weight: bold; margin-bottom: 12px; color: var(--accent-color); border-bottom: 1px solid #444; padding-bottom: 5px; }
  .hint { font-size: 12px; color: #aaa; margin: -6px 0 10px; }


  .options { display: flex; flex-wrap: wrap; gap: 10px; }
  .option-btn { background-color: #333; color: #fff; border: 1px solid #555; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: 0.3s; }
  .option-btn.selected { background-color: var(--accent-color); color: #121212; font-weight: bold; }
  textarea { width: 100%; background-color: #333; border: 1px solid #555; color: #fff; padding: 15px; border-radius: 4px; box-sizing: border-box; min-height: 80px; font-family: inherit; font-size: 16px; }

  .nav { display: flex; gap: 10px; margin-top: 10px; }
  .back-btn { flex: 1; background: transparent; color: var(--text-color); border: 1px solid #555; padding: 18px; font-size: 16px; border-radius: 4px; cursor: pointer; }
  .generate-btn { flex: 2; width: 100%; background-color: var(--text-color); color: var(--bg-color); border: none; padding: 18px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
  .generate-btn:disabled { background-color: #555; color: #999; cursor: default; }
  .warn { color: #e57373; font-size: 13px; margin-top: 8px; min-height: 1em; }

  .result-area { display: none; margin-top: 30px; padding-top: 20px; border-top: 1px dashed #555; }
  .result-note { font-size: 12px; color: #aaa; margin: -6px 0 10px; line-height: 1.6; }
  .copy-btn { width: 100%; background-color: var(--accent-color); color: #121212; border: none; padding: 18px; font-size: 16px; font-weight: bold; border-radius: 4px; margin-top: 15px; cursor: pointer; }
</style>
</head>
<body>

<div class="container">
  <div class="lang-switch">
    <select id="langSelect" onchange="changeLanguage()">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="zh_cn">简体中文</option>
      <option value="zh_tw">繁體中文</option>
    </select>
  </div>

  <h1 id="shopName">BAR BER SHOP 髪座</h1>
  <p class="subtitle" id="subtitle"></p>

  <div class="progress-label" id="progressLabel"></div>
  <div class="progress"><span></span><span></span><span></span></div>

  <!-- ステップ1：来店回数・きっかけ -->
  <div class="step active" id="step1">
    <div class="form-group">
      <label class="section-title" id="q_visit_title"></label>
      <p class="hint" id="optional1"></p>
      <div class="options" id="visitOptions"></div>
    </div>
    <div class="form-group">
      <label class="section-title" id="q_occasion_title"></label>
      <p class="hint" id="optional2"></p>
      <div class="options" id="occasionOptions"></div>
    </div>
    <div class="nav">
      <button class="generate-btn" id="next1" onclick="goStep(2)"></button>
    </div>
  </div>

  <!-- ステップ2：メニュー・良かった点 -->
  <div class="step" id="step2">
    <div class="form-group">
      <label class="section-title" id="q_menu_title"></label>
      <p class="hint" id="multi1"></p>
      <div class="options" id="menuOptions"></div>
    </div>
    <div class="form-group">
      <label class="section-title" id="q_point_title"></label>
      <p class="hint" id="multi2"></p>
      <div class="options" id="pointOptions"></div>
    </div>
    <div class="nav">
      <button class="back-btn" id="back2" onclick="goStep(1)"></button>
      <button class="generate-btn" id="next2" onclick="goStep(3)"></button>
    </div>
    <div class="warn" id="warn2"></div>
  </div>

  <!-- ステップ3：一言感想・作成 -->
  <div class="step" id="step3">
    <div class="form-group">
      <label class="section-title" id="q_free_title"></label>
      <textarea id="freeText"></textarea>
    </div>
    <div class="nav">
      <button class="back-btn" id="back3" onclick="goStep(2)"></button>
      <button class="generate-btn" id="generateBtn" onclick="generateReview()"></button>
    </div>

    <div class="result-area" id="resultArea">
      <label class="section-title" id="res_title"></label>
      <p class="result-note" id="resultNote"></p>
      <textarea id="finalReview" style="min-height: 140px;"></textarea>
      <button class="copy-btn" id="copyBtn" onclick="copyAndOpenMap()"></button>
    </div>
  </div>
</div>

<script>
  const GOOGLE_MAP_URL = "https://g.page/r/CTkk8QIPLQt4EBM/review";

  // 来店回数（任意・1つだけ選ぶ）
  const visits = [
    { id: "v1", ja: "初めて", en: "First time", ko: "처음", zh_cn: "第一次", zh_tw: "第一次" },
    { id: "v2", ja: "何度か", en: "A few times", ko: "몇 번", zh_cn: "来过几次", zh_tw: "來過幾次" },
    { id: "v3", ja: "いつも通っている", en: "Regular", ko: "단골", zh_cn: "常客", zh_tw: "常客" }
  ];

  // 今回のきっかけ（任意・1つだけ選ぶ）
  const occasions = [
    { id: "o1", ja: "いつものメンテナンス", en: "Regular trim", ko: "평소 관리", zh_cn: "日常修剪", zh_tw: "日常修剪" },
    { id: "o2", ja: "仕事・就活の前", en: "Before work / job hunting", ko: "일·취업 준비 전", zh_cn: "工作或求职前", zh_tw: "工作或求職前" },
    { id: "o3", ja: "イベント・結婚式の前", en: "Before an event / wedding", ko: "행사·결혼식 전", zh_cn: "活动或婚礼前", zh_tw: "活動或婚禮前" },
    { id: "o4", ja: "気分を変えたくて", en: "Wanted a change", ko: "기분 전환", zh_cn: "想换个心情", zh_tw: "想換個心情" },
    { id: "o5", ja: "旅行中", en: "While traveling", ko: "여행 중", zh_cn: "旅行途中", zh_tw: "旅行途中" }
  ];

  // メニューは4つだけ（パーマは全種類、カラーはメッシュも含めて一括り）
  const menus = [
    { id: "m1", ja: "カット", en: "Cut", ko: "커트", zh_cn: "剪发", zh_tw: "剪髮" },
    { id: "m2", ja: "フェード", en: "Fade", ko: "페이드", zh_cn: "渐变", zh_tw: "漸層" },
    { id: "m4", ja: "パーマ", en: "Perm", ko: "파마", zh_cn: "烫发", zh_tw: "燙髮" },
    { id: "m3", ja: "カラー", en: "Color", ko: "컬러", zh_cn: "染发", zh_tw: "染髮" }
  ];

  const points = [
    { id: "p1", ja: "丁寧なカウンセリング", en: "Careful consultation", ko: "꼼꼼한 상담", zh_cn: "细致的咨询", zh_tw: "仔細的諮詢" },
    { id: "p2", ja: "希望通りの仕上がり", en: "Finish as imagined", ko: "원하던 스타일 완성", zh_cn: "符合预期的效果", zh_tw: "符合預期的效果" },
    { id: "p3", ja: "手際が良くスピーディー", en: "Quick and skillful", ko: "빠르고 능숙함", zh_cn: "手法娴熟", zh_tw: "手法俐落" },
    { id: "p4", ja: "丁寧な接客", en: "Attentive service", ko: "친절한 응대", zh_cn: "周到的服务", zh_tw: "周到的服務" },
    { id: "p5", ja: "駅からの近さ", en: "Close to the station", ko: "역에서 가까움", zh_cn: "离车站近", zh_tw: "離車站近" },
    { id: "p6", ja: "落ち着く内装", en: "Relaxing interior", ko: "편안한 인테리어", zh_cn: "舒适的内饰", zh_tw: "舒適的裝潢" },
    { id: "p7", ja: "シャンプーが快適", en: "Comfortable shampoo", ko: "시원한 샴푸", zh_cn: "舒适的洗发", zh_tw: "舒服的洗髮" }
  ];

  const uiText = {
    ja: { sub: "サービス向上のためのアンケート", step: "ステップ", q_visit: "1. ご来店は何回目ですか？", q_occasion: "2. 今回のきっかけは？", optional: "任意・スキップできます", q_menu: "3. 本日のメニューは？", q_point: "4. 良かった点は？", multi: "いくつでも選べます", q_free: "5. 一言感想（任意）", ph: "例：伸びてきたら、またお願いしようと思います", next: "次へ", back: "戻る", needMenu: "メニューを1つ以上選んでください", btn: "口コミの下書きを作る", res: "口コミの下書き", note: "ご自身の言葉に自由に書き換えてからご投稿ください。星の数はGoogleマップの画面でご自身でお選びください。", fallbackNote: "文章をうまく作れませんでした。お手数ですが、下のメモを参考にご自身で書いていただけると嬉しいです。", copy: "📋 コピーしてGoogleマップを開く", loading: "作成中...", copied: "コピーしました！", visit: "来店", occasion: "きっかけ", menu: "メニュー", point: "良かった点", free: "一言" },
    en: { sub: "Customer Satisfaction Survey", step: "Step", q_visit: "1. How many times have you visited?", q_occasion: "2. What brought you in today?", optional: "Optional — you can skip", q_menu: "3. Today's menu?", q_point: "4. What did you like?", multi: "Select as many as you like", q_free: "5. Comments (Optional)", ph: "ex: I'll definitely come back next time I'm in Kyoto", next: "Next", back: "Back", needMenu: "Please select at least one menu item", btn: "Create a review draft", res: "Review draft", note: "Please feel free to rewrite it in your own words before posting. Choose your star rating yourself on the Google Maps screen.", fallbackNote: "We couldn't create a draft this time. Please use the notes below as a reference and write in your own words.", copy: "📋 Copy & Open Google Maps", loading: "Creating...", copied: "Copied!", visit: "Visit", occasion: "Occasion", menu: "Menu", point: "Liked", free: "Comment" },
    ko: { sub: "서비스 향상을 위한 설문조사", step: "단계", q_visit: "1. 몇 번째 방문이신가요?", q_occasion: "2. 이번 방문 계기는?", optional: "선택 사항 · 건너뛰어도 됩니다", q_menu: "3. 오늘의 메뉴는?", q_point: "4. 좋았던 점은?", multi: "여러 개 선택할 수 있습니다", q_free: "5. 한마디 (선택)", ph: "예: 다음에 교토에 오면 또 들르고 싶어요", next: "다음", back: "뒤로", needMenu: "메뉴를 하나 이상 선택해 주세요", btn: "리뷰 초안 만들기", res: "리뷰 초안", note: "게시하기 전에 자유롭게 본인의 말로 고쳐 주세요. 별점은 Google 지도 화면에서 직접 선택해 주세요.", fallbackNote: "초안을 만들지 못했습니다. 아래 메모를 참고해 직접 작성해 주시면 감사하겠습니다.", copy: "📋 복사 후 Google 지도 열기", loading: "작성 중...", copied: "복사되었습니다!", visit: "방문", occasion: "계기", menu: "메뉴", point: "좋았던 점", free: "한마디" },
    zh_cn: { sub: "服务满意度调查", step: "步骤", q_visit: "1. 这是第几次来店？", q_occasion: "2. 这次来店的原因？", optional: "选填，可跳过", q_menu: "3. 今天的项目？", q_point: "4. 满意的地方？", multi: "可多选", q_free: "5. 留言（选填）", ph: "例：下次来京都还想再来", next: "下一步", back: "返回", needMenu: "请至少选择一个项目", btn: "生成评价草稿", res: "评价草稿", note: "发布前请随意改成您自己的话。星级请在Google地图页面上自行选择。", fallbackNote: "这次没能生成草稿。请参考下面的要点，用自己的话写评价。", copy: "📋 复制并打开Google地图", loading: "生成中...", copied: "已复制！", visit: "来店", occasion: "原因", menu: "项目", point: "满意之处", free: "留言" },
    zh_tw: { sub: "服務滿意度調查", step: "步驟", q_visit: "1. 這是第幾次來店？", q_occasion: "2. 這次來店的原因？", optional: "選填，可跳過", q_menu: "3. 今天的項目？", q_point: "4. 滿意的地方？", multi: "可複選", q_free: "5. 留言（選填）", ph: "例：下次來京都還想再來", next: "下一步", back: "返回", needMenu: "請至少選擇一個項目", btn: "產生評價草稿", res: "評價草稿", note: "發布前請隨意改成您自己的話。星等請在Google地圖頁面上自行選擇。", fallbackNote: "這次沒能產生草稿。請參考下面的重點，用自己的話寫評價。", copy: "📋 複製並打開Google地圖", loading: "產生中...", copied: "已複製！", visit: "來店", occasion: "原因", menu: "項目", point: "滿意之處", free: "留言" }
  };

  let selectedMenus = [];
  let selectedPoints = [];
  let selectedVisit = null;
  let selectedOccasion = null;
  let currentLang = "ja";
  let currentStep = 1;

  const $ = id => document.getElementById(id);

  // 複数選択のボタン
  function renderMulti(containerId, list, selected) {
    const box = $(containerId); box.innerHTML = "";
    list.forEach(item => {
      const btn = document.createElement("div");
      btn.className = "option-btn"; btn.innerText = item[currentLang];
      if (selected.find(x => x.id === item.id)) btn.classList.add("selected");
      btn.onclick = () => {
        btn.classList.toggle("selected");
        const i = selected.findIndex(x => x.id === item.id);
        if (i === -1) selected.push(item); else selected.splice(i, 1);
        $("warn2").innerText = "";
      };
      box.appendChild(btn);
    });
  }

  // 1つだけ選ぶボタン（もう一度押すと解除）
  function renderSingle(containerId, list, getSel, setSel) {
    const box = $(containerId); box.innerHTML = "";
    list.forEach(item => {
      const btn = document.createElement("div");
      btn.className = "option-btn"; btn.innerText = item[currentLang];
      if (getSel() && getSel().id === item.id) btn.classList.add("selected");
      btn.onclick = () => {
        setSel(getSel() && getSel().id === item.id ? null : item);
        renderSingle(containerId, list, getSel, setSel);
      };
      box.appendChild(btn);
    });
  }

  function renderOptions() {
    renderSingle("visitOptions", visits, () => selectedVisit, v => selectedVisit = v);
    renderSingle("occasionOptions", occasions, () => selectedOccasion, v => selectedOccasion = v);
    renderMulti("menuOptions", menus, selectedMenus);
    renderMulti("pointOptions", points, selectedPoints);
  }

  function goStep(n) {
    if (n === 3 && selectedMenus.length === 0) {
      $("warn2").innerText = uiText[currentLang].needMenu;
      return;
    }
    currentStep = n;
    [1, 2, 3].forEach(i => $("step" + i).classList.toggle("active", i === n));
    document.querySelectorAll(".progress span").forEach((s, i) => s.classList.toggle("done", i < n));
    $("progressLabel").innerText = `${uiText[currentLang].step} ${n} / 3`;
    window.scrollTo(0, 0);
  }

  function changeLanguage() {
    currentLang = $("langSelect").value;
    const ui = uiText[currentLang];
    const set = (id, text) => $(id).innerText = text;
    set("subtitle", ui.sub);
    set("q_visit_title", ui.q_visit);
    set("q_occasion_title", ui.q_occasion);
    set("optional1", ui.optional);
    set("optional2", ui.optional);
    set("q_menu_title", ui.q_menu);
    set("q_point_title", ui.q_point);
    set("multi1", ui.multi);
    set("multi2", ui.multi);
    set("q_free_title", ui.q_free);
    $("freeText").placeholder = ui.ph;
    ["next1", "next2"].forEach(id => set(id, ui.next));
    ["back2", "back3"].forEach(id => set(id, ui.back));
    set("generateBtn", ui.btn);
    set("res_title", ui.res);
    set("copyBtn", ui.copy);
    $("warn2").innerText = "";
    renderOptions();
    goStep(currentStep);
  }

  // AIが失敗したときに見せるメモ（選んだ内容の箇条書き）
  function buildFallbackMemo() {
    const ui = uiText[currentLang];
    const lines = [];
    if (selectedVisit) lines.push(`${ui.visit}: ${selectedVisit[currentLang]}`);
    if (selectedOccasion) lines.push(`${ui.occasion}: ${selectedOccasion[currentLang]}`);
    lines.push(`${ui.menu}: ${selectedMenus.map(m => m[currentLang]).join(" / ")}`);
    if (selectedPoints.length) lines.push(`${ui.point}: ${selectedPoints.map(p => p[currentLang]).join(" / ")}`);
    const free = $("freeText").value.trim();
    if (free) lines.push(`${ui.free}: ${free}`);
    return lines.join("\n");
  }

  async function generateReview() {
    // 星はアンケートでは聞かない（お客様がGoogleの投稿画面で自分で選ぶ）
    const ui = uiText[currentLang];
    const generateBtn = $("generateBtn");

    generateBtn.disabled = true;
    generateBtn.innerText = ui.loading;

    const payload = {
      language: currentLang,
      visit: selectedVisit ? selectedVisit.id : null,
      occasion: selectedOccasion ? selectedOccasion.id : null,
      menus: selectedMenus.map(m => m.id),
      points: selectedPoints.map(p => p.id),
      freeText: $("freeText").value.trim()
    };

    try {
      const res = await fetch("/api/generate-review", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok || !data.review) throw new Error(data.error || "failed");
      $("finalReview").value = data.review;
      $("resultNote").innerText = ui.note;
    } catch (err) {
      console.error(err);
      $("finalReview").value = buildFallbackMemo();
      $("resultNote").innerText = ui.fallbackNote;
    } finally {
      $("resultArea").style.display = "block";
      generateBtn.disabled = false;
      generateBtn.innerText = ui.btn;
      $("resultArea").scrollIntoView({ behavior: "smooth" });
    }
  }

  function copyAndOpenMap() {
    const text = $("finalReview").value;
    navigator.clipboard.writeText(text).then(() => {
      alert(uiText[currentLang].copied);
      window.location.href = GOOGLE_MAP_URL;
    });
  }

  window.onload = changeLanguage;
</script>
</body>
</html>
